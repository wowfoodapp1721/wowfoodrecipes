<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Screen 22: Cook Mode</title>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&amp;family=Hanken+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = {theme: {extend: {fontFamily: {serif: ["\"EB Garamond\"", "serif"], sans: ["\"Plus Jakarta Sans\"", "sans-serif"], mono: ["\"JetBrains Mono\"", "monospace"], "headline-lg-mobile": ["EB Garamond"], "headline-lg": ["EB Garamond"], "body-sm": ["Hanken Grotesk"], "body-lg": ["Hanken Grotesk"], "display-lg": ["EB Garamond"], "title-md": ["Hanken Grotesk"], "label-caps": ["Hanken Grotesk"]}, colors: {amber: {glow: "#FF9900", accent: "#FFB340", deep: "#CC7A00"}, "surface-container-lowest": "#0e0e0e", "on-secondary-fixed": "#002107", background: "#131313", "primary-container": "#ff9900", primary: "#ffc082", "on-surface-variant": "#dbc2ad", "inverse-on-surface": "#303030", "surface-tint": "#ffb86f", "primary-fixed-dim": "#ffb86f", secondary: "#ebffe6", "error-container": "#93000a", "on-surface": "#e2e2e2", "on-tertiary": "#690006", "on-background": "#e2e2e2", "on-primary-fixed": "#2c1600", error: "#ffb4ab", "primary-fixed": "#ffdcbd", "surface-bright": "#393939", "on-primary-container": "#653a00", "secondary-fixed": "#6bff83", "inverse-primary": "#8a5100", surface: "#131313", "inverse-surface": "#e2e2e2", "tertiary-fixed": "#ffdad6", "on-primary": "#4a2800", "surface-container-high": "#2a2a2a", "on-secondary-container": "#007128", "surface-dim": "#131313", "surface-container-highest": "#353535", "on-primary-fixed-variant": "#693c00", "on-tertiary-fixed-variant": "#93000d", tertiary: "#ffbcb5", "surface-container": "#1f1f1f", outline: "#a38d7a", "on-error-container": "#ffdad6", "on-secondary-fixed-variant": "#00531b", "on-tertiary-container": "#8d000c", "secondary-fixed-dim": "#00e55b", "on-secondary": "#003911", "tertiary-fixed-dim": "#ffb4ac", "on-tertiary-fixed": "#410002", "surface-variant": "#353535", "surface-container-low": "#1b1b1b", "on-error": "#690005", "outline-variant": "#554434", "secondary-container": "#00fe66", "tertiary-container": "#ff9389"}, fontSize: {"headline-lg-mobile": ["28px", {lineHeight: "36px", fontWeight: "500"}], "headline-lg": ["32px", {lineHeight: "40px", fontWeight: "500"}], "body-sm": ["14px", {lineHeight: "20px", fontWeight: "400"}], "body-lg": ["16px", {lineHeight: "24px", fontWeight: "400"}], "display-lg": ["48px", {lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "600"}], "title-md": ["20px", {lineHeight: "28px", fontWeight: "600"}], "label-caps": ["12px", {lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700"}]}, spacing: {gutter: "16px", "stack-md": "12px", "container-margin": "24px", base: "8px", "stack-lg": "24px", "stack-sm": "4px"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}}}};</script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Subtle pulsing animations */
    @keyframes pulse-ring {
      0%, 100% {
        filter: drop-shadow(0 0 16px rgba(255, 153, 0, 0.45)) drop-shadow(0 0 35px rgba(255, 153, 0, 0.2));
      }
      50% {
        filter: drop-shadow(0 0 24px rgba(255, 153, 0, 0.65)) drop-shadow(0 0 50px rgba(255, 153, 0, 0.35));
      }
    }
    .timer-glow {
      animation: pulse-ring 4s ease-in-out infinite;
    }
    @keyframes subtle-breath {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .voice-pulse {
      animation: subtle-breath 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#000000] text-white font-sans antialiased min-h-screen flex items-center justify-center p-0 m-0 select-none">
<!-- Mobile Device Viewport -->
<div class="w-full max-w-[420px] h-[1024px] max-h-[900px] bg-[#000000] flex flex-col justify-between relative overflow-hidden px-6 pt-5 pb-6 border-x border-neutral-900/60 shadow-2xl">
<!-- TOP HEADER UTILITY -->
<header class="w-full flex items-center justify-between z-20 pt-2">
<!-- Exit Button (Left) -->
<button class="w-11 h-11 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 active:scale-95 flex items-center justify-center text-white/80 hover:text-white transition-all">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
<!-- Step Indicator Badge (Center) -->
<div class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/[0.04] border border-white/10 backdrop-blur-md">
<span class="w-1.5 h-1.5 rounded-full bg-[#FF9900] shadow-[0_0_8px_#FF9900]"></span>
<span class="text-xs font-semibold tracking-wider uppercase text-neutral-300">Step 1 of 5</span>
</div>
<!-- Screen Awake Indicator (Right) -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#FF9900]/10 border border-[#FF9900]/30 shadow-[0_0_15px_rgba(255,153,0,0.25)]">
<span class="material-symbols-outlined text-[16px] text-[#FF9900]">lock_clock</span>
<span class="text-[11px] font-bold tracking-tight text-[#FF9900] uppercase">Awake</span>
</div>
</header>
<!-- MAIN STEP CONTENT & GIANT TIMER (Center Zone) -->
<main class="flex-1 flex flex-col justify-center items-center text-center my-auto py-2 z-10">
<!-- Extra-Large Step Content (Upper-Center) -->
<div class="w-full mb-8">
<div class="inline-block text-[#FF9900] text-xs font-mono uppercase tracking-[0.25em] font-semibold mb-3">
          Cold Fermentation &amp; Proofing
        </div>
<h1 class="text-[26px] sm:text-[28px] font-bold leading-[1.35] tracking-tight text-neutral-100 font-serif px-1">
          Dissolve yeast in <span class="text-[#FFB340] underline decoration-[#FF9900]/40 underline-offset-4 font-sans">250ml</span> cold water. Mix with flour and salt, kneading until elastic.
        </h1>
</div>
<!-- Giant Visual Countdown Timer (Center of the screen) -->
<div class="relative w-[240px] h-[240px] sm:w-[260px] sm:h-[260px] flex items-center justify-center my-2">
<!-- Ambient radial glow behind timer -->
<div class="absolute inset-0 rounded-full bg-[#FF9900]/10 blur-2xl pointer-events-none"></div>
<!-- SVG Circular Progress Ring -->
<svg class="w-full h-full transform -rotate-90 timer-glow" viewbox="0 0 240 240">
<!-- Background track -->
<circle cx="120" cy="120" fill="transparent" r="104" stroke="#1a1a1a" stroke-width="7"></circle>
<!-- Glowing Golden-Orange Progress Accent Ring -->
<circle cx="120" cy="120" fill="transparent" r="104" stroke="url(#amberGradient)" stroke-dasharray="653.45" stroke-dashoffset="140" stroke-linecap="round" stroke-width="7"></circle>
<!-- Defs for Gradient -->
<defs>
<lineargradient id="amberGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFB340"></stop>
<stop offset="50%" stop-color="#FF9900"></stop>
<stop offset="100%" stop-color="#FF7700"></stop>
</lineargradient>
</defs>
</svg>
<!-- Timer Numeric Value Overlay -->
<div class="absolute flex flex-col items-center justify-center">
<span class="text-[11px] uppercase tracking-[0.25em] font-mono text-neutral-400 mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[13px] text-[#FF9900]">timer</span>
            Resting Duration
          </span>
<div class="text-[40px] sm:text-[44px] font-mono font-bold tracking-tight text-white drop-shadow-[0_0_12px_rgba(255,255,255,0.2)]">
            24:00:00
          </div>
<span class="text-[11px] font-sans font-medium text-[#FF9900] tracking-wide mt-1 bg-[#FF9900]/10 px-2.5 py-0.5 rounded-full border border-[#FF9900]/20">
            Slow Chill Ferment
          </span>
</div>
</div>
<!-- Quick Step Navigation controls (Minimalist Dots) -->
<div class="flex items-center gap-2 mt-6">
<span class="w-7 h-1.5 rounded-full bg-[#FF9900] shadow-[0_0_8px_#FF9900]"></span>
<span class="w-1.5 h-1.5 rounded-full bg-white/20"></span>
<span class="w-1.5 h-1.5 rounded-full bg-white/20"></span>
<span class="w-1.5 h-1.5 rounded-full bg-white/20"></span>
<span class="w-1.5 h-1.5 rounded-full bg-white/20"></span>
</div>
</main>
<!-- HANDS-FREE ASSISTANT BAR (Absolute Bottom) -->
<footer class="w-full z-20 pb-2">
<div class="w-full bg-[#05110A] border border-[#10B981]/30 rounded-2xl p-3.5 flex items-center justify-between shadow-[0_0_25px_rgba(16,185,129,0.18)] voice-pulse backdrop-blur-lg">
<!-- Left icon group & text prompt -->
<div class="flex items-center gap-3">
<!-- Glowing mic orb -->
<div class="w-9 h-9 rounded-xl bg-[#10B981]/15 border border-[#10B981]/40 flex items-center justify-center text-[#10B981] shadow-[0_0_12px_rgba(16,185,129,0.35)] shrink-0">
<span class="material-symbols-outlined text-[20px]">mic</span>
</div>
<!-- Command label -->
<div class="flex flex-col text-left">
<div class="flex items-center gap-1.5 text-xs font-semibold text-[#34D399] tracking-wide">
<span class="w-1.5 h-1.5 rounded-full bg-[#10B981] animate-ping"></span>
              Voice Control Active
            </div>
<div class="text-[12px] text-neutral-300 font-normal leading-tight mt-0.5">
              Say <span class="text-white font-semibold font-mono">"Next"</span> or <span class="text-white font-semibold">Wave</span> to flip page
            </div>
</div>
</div>
<!-- Right icon indicator (Hand-wave / Gesture recognition) -->
<div class="w-8 h-8 rounded-lg bg-white/[0.04] border border-white/10 flex items-center justify-center text-[#34D399]/80 shrink-0" title="Gesture Sensor Ready">
<span class="material-symbols-outlined text-[18px]">waving_hand</span>
</div>
</div>
</footer>
</div>
</body></html>
