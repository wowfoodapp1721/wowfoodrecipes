<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.pricing-card');
            const radios = document.querySelectorAll('input[name="premium_plan"]');
            const activateBtn = document.getElementById('activate-btn');
            const overlay = document.getElementById('razorpay-overlay');
            const closeOverlayBtn = document.getElementById('close-overlay');
            const rzpAmount = document.getElementById('rzp-amount');

            // Handle card selection styling
            function updateCardStyles() {
                cards.forEach(card => {
                    const radio = card.querySelector('input');
                    if (radio.checked) {
                        card.classList.add('border-primary-container/50', 'bg-surface-container/80');
                        card.classList.remove('border-white/10', 'bg-surface-container/60');
                    } else {
                        card.classList.remove('border-primary-container/50', 'bg-surface-container/80');
                        card.classList.add('border-white/10', 'bg-surface-container/60');
                    }
                });
            }

            // Click entire card to select
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const radio = card.querySelector('input');
                    radio.checked = true;
                    updateCardStyles();
                });
            });

            // Initial state
            updateCardStyles();

            // Checkout flow
            activateBtn.addEventListener('click', () => {
                const selectedPlan = document.querySelector('input[name="premium_plan"]:checked').value;
                rzpAmount.textContent = `₹${selectedPlan}.00`;
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            });

            closeOverlayBtn.addEventListener('click', () => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            });
        });
    </script>
