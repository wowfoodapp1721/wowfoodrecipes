<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Screen 3I - Edit Recipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#FF3B30',
              charcoal: '#1C1C1E',
              cardBorder: '#2C2C2E',
              inputBorder: '#3A3A3C',
              muted: '#8E8E93',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .tap-effect:active {
      transform: scale(0.98);
      transition: transform 0.15s ease;
    }
  </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-0 m-0">
<!-- Mobile Viewport Container (~390px x 844px) -->
<main class="w-full max-w-[390px] h-[844px] max-h-[844px] bg-black text-white relative flex flex-col justify-between overflow-hidden shadow-2xl border border-white/5 select-none">
<!-- Top Status Bar -->
<header class="w-full pt-3 px-6 flex justify-between items-center text-xs font-semibold text-white/90 z-20">
<span>9:41</span>
<div class="flex items-center space-x-1.5 text-sm">
<span class="material-symbols-outlined text-[15px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[15px]">wifi</span>
<span class="material-symbols-outlined text-[17px]">battery_full</span>
</div>
</header>
<!-- Navigation Bar -->
<nav class="w-full px-5 pt-3 pb-3 flex items-center justify-between z-20">
<div class="flex items-center space-x-3">
<!-- Close (X) Icon Button -->
<button aria-label="Close edit mode" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-white hover:bg-white/10 active:scale-95 transition-all focus:outline-none">
<span class="material-symbols-outlined text-[26px]">close</span>
</button>
<h1 class="text-xl font-bold tracking-tight text-white">Edit Recipe</h1>
</div>
<!-- Clickable Save Text Button in Signature Vibrant Red (#FF3B30) -->
<button class="text-[#FF3B30] font-bold text-base tracking-wide px-3 py-1.5 rounded-lg hover:bg-brand-red/10 active:scale-95 transition-all focus:outline-none tap-effect">
        Save
      </button>
</nav>
<!-- Scrollable Content Stack -->
<section class="flex-1 overflow-y-auto px-5 pt-1 pb-4 space-y-5">
<!-- Recipe Context Preview Card (Horizontal #1C1C1E) -->
<article class="w-full bg-[#1C1C1E] border border-white/10 rounded-2xl p-3.5 flex items-center space-x-3.5 shadow-lg relative group">
<!-- Thumbnail with Glistening Amber Glazed Chicken -->
<div class="relative w-16 h-16 rounded-xl overflow-hidden flex-shrink-0 bg-neutral-900 border border-white/10">
<img alt="Honey Sesame Chicken preview thumbnail" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1WCmy_gwguUOh4d8PmdioCm4X1F5QCUk34eHxlBDTZclV7ncx9YvdSOCShpEYcP3IKH8OOIMxxjaUGXpWMNjCSF9dT4C0Qzmaeanjc2e3L8ECoYJ18JMjMcBv2Vman9y3Byb5LLIP25D6vnu8nOfR4NSdF4Zg1hASOjf_gk2CdwPSRnUepClVxEJf_MfbPM45b1j3UoyRvrL-xPgP5BJ5lbu1KIzFuPc8gcL6WmBq_1DHfDonW-OMgb2wz0"/>
<div class="absolute inset-0 bg-black/20"></div>
</div>
<!-- Title and Subtle Edit Pencil Overlay -->
<div class="flex-1 min-w-0 pr-1">
<span class="text-[11px] font-semibold tracking-wider uppercase text-white/50 block mb-0.5">Active Recipe</span>
<div class="flex items-center justify-between">
<h2 class="text-[17px] font-bold text-white truncate tracking-tight">Honey Sesame Chicken</h2>
<!-- Subtle Edit Pencil Icon Overlay -->
<button class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/15 active:scale-90 transition-all flex items-center justify-center text-white/80 ml-2 flex-shrink-0" title="Edit thumbnail photo">
<span class="material-symbols-outlined text-[17px]">edit</span>
</button>
</div>
</div>
</article>
<!-- Editable Form Stack -->
<form class="space-y-4 pt-1" onsubmit="event.preventDefault()">
<!-- Recipe Title (Contextual Extra Field) -->
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-white tracking-wide">Recipe Name</label>
<div class="relative">
<input class="w-full bg-[#1C1C1E] text-white border border-white/10 focus:border-[#FF3B30] focus:ring-1 focus:ring-[#FF3B30] rounded-xl px-4 py-3.5 text-base font-medium outline-none transition-colors" type="text" value="Honey Sesame Chicken"/>
<span class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-white/30 text-lg pointer-events-none">edit_note</span>
</div>
</div>
<!-- Row 1: Prep Time -->
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-white tracking-wide">Prep Time</label>
<div class="relative">
<input class="w-full bg-[#1C1C1E] text-white border border-white/10 focus:border-[#FF3B30] focus:ring-1 focus:ring-[#FF3B30] rounded-xl px-4 py-3.5 text-base font-medium outline-none transition-colors" type="text" value="10 min"/>
<span class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-white/30 text-lg pointer-events-none">schedule</span>
</div>
</div>
<!-- Row 2: Cook Time -->
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-white tracking-wide">Cook Time</label>
<div class="relative">
<input class="w-full bg-[#1C1C1E] text-white border border-white/10 focus:border-[#FF3B30] focus:ring-1 focus:ring-[#FF3B30] rounded-xl px-4 py-3.5 text-base font-medium outline-none transition-colors" type="text" value="20 min"/>
<span class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-white/30 text-lg pointer-events-none">timer</span>
</div>
</div>
<!-- Row 3: Servings -->
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-white tracking-wide">Servings</label>
<div class="relative">
<input class="w-full bg-[#1C1C1E] text-white border border-white/10 focus:border-[#FF3B30] focus:ring-1 focus:ring-[#FF3B30] rounded-xl px-4 py-3.5 text-base font-medium outline-none transition-colors" type="text" value="4"/>
<span class="material-symbols-outlined absolute right-3.5 top-1/2 -translate-y-1/2 text-white/30 text-lg pointer-events-none">group</span>
</div>
</div>
<!-- Subtle Info Tip -->
<div class="pt-1 flex items-center space-x-2 text-white/40 text-xs px-1">
<span class="material-symbols-outlined text-sm text-[#FF3B30]">info</span>
<span>Ingredients and instructions sync dynamically upon saving.</span>
</div>
</form>
</section>
<!-- Absolute Baseline Footer Area -->
<footer class="w-full px-5 pt-3 pb-3 bg-gradient-to-t from-black via-black to-transparent z-20 flex flex-col items-center">
<!-- Full-Width Rounded Secondary Delete Action Button -->
<button class="w-full py-3.5 px-4 rounded-2xl border border-white/20 bg-[#1C1C1E]/60 hover:bg-red-500/10 hover:border-red-500/40 text-white font-bold text-base tracking-wide flex items-center justify-center space-x-2 active:scale-98 transition-all tap-effect group">
<span class="material-symbols-outlined text-white/70 group-hover:text-[#FF3B30] text-[20px] transition-colors">delete</span>
<span class="group-hover:text-white transition-colors">Delete Recipe</span>
</button>
<!-- Minimalist Horizontal Gray Android Home Navigation Indicator Pill -->
<div class="w-full pt-3 pb-1 flex justify-center items-center">
<div class="w-32 h-1 bg-[#8E8E93]/60 rounded-full"></div>
</div>
</footer>
</main>
</body>
</html>
