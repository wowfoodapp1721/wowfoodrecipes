<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' data: gap: https://gstatic.com 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://googleapis.com; font-src 'self' https://gstatic.com; img-src 'self' data: blob: https://wowfoodrecipes.com https://themealdb.com; connect-src 'self' https://wowfoodrecipes.com;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description"
    content="wow Food Recipes — Visual Search Results Grid Screen. Select gourmet recipes from our live culinary database." />
  <title>wow | Search Results Grid</title>

  <!-- Google Fonts: EB Garamond (Serif) + Plus Jakarta Sans / Work Sans (UI body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <!-- Material Symbols Outlined -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <!-- Global Viewport Controller Stylesheet -->
  <link rel="stylesheet" href="assets/viewport-controller.css" />
  <!-- wow Chef AI Stylesheet -->
  <link rel="stylesheet" href="assets/chef-ai.css" />

  <style>
    /* ─── CSS Reset & Base Tokens ────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #0B0F14;
      --surface-base: #0B0F14;
      --surface-card: #131920;
      --surface-chip: #19212C;
      --surface-input: #1A232E;
      --surface-glass: rgba(11, 15, 20, 0.85);

      --crimson: #3DF2E0;
      --crimson-hover: #20C5B5;
      --crimson-dim: rgba(61, 242, 224, 0.15);
      --crimson-glow: rgba(61, 242, 224, 0.35);
      --mango: #FF9900;
      --emerald: #00E676;
      --amber: #FBBF24;

      --text-white: #FFFFFF;
      --text-main: #E5E5EA;
      --text-muted: #8E8E93;
      --text-dim: #636366;

      --border-soft: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.14);
      --border-focus: rgba(61, 242, 224, 0.5);

      --font-serif: 'EB Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', 'Work Sans', -apple-system, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: var(--black);
      color: var(--text-white);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow-x: hidden;
    }

    /* ─── Standardized Mobile Viewport (393px × 852px) ─────────────────── */
    #viewport {
      position: relative;
      width: 393px;
      height: 852px;
      background-color: var(--black);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 44px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 32px 80px rgba(0, 0, 0, 0.95);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Tap feedback */
    .tap-effect {
      transition: transform 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
    }

    .tap-effect:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    /* ─── TOP FIXED HEADER ─────────────────────────────────────────────── */
    .search-results-header {
      padding: 44px 16px 12px;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .search-nav-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-back-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--surface-chip);
      border: 1px solid var(--border-soft);
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: background-color 0.2s, transform 0.15s;
    }

    .search-back-btn:active {
      transform: scale(0.92);
      background-color: var(--surface-input);
    }

    .search-active-capsule {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: var(--surface-input);
      border: 1px solid rgba(255, 59, 48, 0.4);
      border-radius: 999px;
      padding: 4px 10px 4px 12px;
      gap: 8px;
      box-shadow: 0 0 12px rgba(255, 59, 48, 0.2);
    }

    .search-active-capsule input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-white);
      caret-color: var(--crimson);
    }

    .search-active-capsule input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .search-clear-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    .search-clear-btn:hover {
      color: var(--text-white);
    }

    .search-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .search-query-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .search-query-label span {
      color: var(--text-white);
      font-weight: 700;
    }

    .search-count-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--crimson);
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid rgba(255, 59, 48, 0.35);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ─── FLUID SCROLLABLE 1-COLUMN LIST CANVAS ────────────────────────── */
    #search-grid-scroll {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 140px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background-color: var(--black);
    }

    .search-results-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }

    /* Single-Column Spacious Card Architecture (Matching Curated Creations) */
    .search-grid-card {
      width: 100%;
      background-color: var(--surface-card);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.2s;
      position: relative;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .search-grid-card:hover {


      border-color: rgba(61, 242, 224, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 16px rgba(61, 242, 224, 0.25);
    }

    }

    .search-grid-card:active {
      transform: scale(0.98);
    }

    .search-card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #121212;
      border-radius: 16px 16px 0 0;
    }

    .search-card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      aspect-ratio: 16 / 9;
      border-radius: 16px 16px 0 0;
      display: block;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-grid-card:hover .search-card-thumb {
      transform: scale(1.04);
    }

    .search-card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 59, 48, 0.4);
      color: var(--crimson);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .search-card-content {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 14px;
      box-sizing: border-box;
      background-color: var(--surface-card);
    }

    .search-card-info-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .search-card-title {
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
      margin: 0;
      letter-spacing: -0.01em;
      font-family: var(--font-body);
    }

    .search-card-metrics {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #D4D4D4;
      background: rgba(0, 0, 0, 0.6);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
    }

    .search-metric-pill .material-symbols-outlined {
      font-size: 14px;
    }

    .search-metric-pill.time .material-symbols-outlined {
      color: var(--crimson);
    }

    .search-metric-pill.cal .material-symbols-outlined {
      color: #FF9900;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ─── PERSISTENT BOTTOM NAVIGATION BAR ─────────────────────────────── */
    #app-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 76px;
      z-index: 50;
      background-color: rgba(11, 15, 20, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-soft, rgba(255, 255, 255, 0.1));
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px 12px;
      box-sizing: border-box;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 52px;
      padding: 2px 2px;
      flex: 1;
      min-width: 0;
      color: #6D6D72;
      transition: all 0.25s ease-in-out;
      position: relative;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-tab:active {
      transform: scale(0.95);
    }

    .nav-tab .material-symbols-outlined {
      font-size: 22px;
      line-height: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease-in-out;
    }

    .nav-tab .nav-label,
    .nav-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.2;
      margin-top: 3px;
      white-space: nowrap;
      text-align: center;
      transition: all 0.25s ease-in-out;
    }

    /* Micro-Indicator Dot Glow (4px Neon Cyan circular dot) */
    .nav-tab::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #3DF2E0;
      box-shadow: 0 0 8px #3DF2E0;
      opacity: 0;
      transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out;
      pointer-events: none;
    }

    /* Interactive Hover & Focus States (Neon Cyan Glow) */
    .nav-tab:hover,
    .nav-tab:focus-visible {
      color: #3DF2E0;
    }

    .nav-tab:hover .material-symbols-outlined,
    .nav-tab:focus-visible .material-symbols-outlined {
      color: #3DF2E0;
      filter: drop-shadow(0 0 6px rgba(61, 242, 224, 0.7));
      transform: scale(1.08);
    }

    .nav-tab:hover .nav-label,
    .nav-tab:focus-visible .nav-label {
      color: #3DF2E0;
      text-shadow: 0 0 6px rgba(61, 242, 224, 0.5);
    }

    .nav-tab:hover::after,
    .nav-tab:focus-visible::after {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    /* Active Selected State - Locked in Solid Neon Cyan */
    .nav-tab.nav-tab--active,
    .nav-tab--active {
      color: #3DF2E0 !important;
    }

    .nav-tab.nav-tab--active .material-symbols-outlined,
    .nav-tab--active .material-symbols-outlined {
      color: #3DF2E0 !important;
      filter: drop-shadow(0 0 6px rgba(61, 242, 224, 0.7)) !important;
    }

    .nav-tab.nav-tab--active .nav-label,
    .nav-tab--active .nav-label {
      color: #3DF2E0 !important;
      text-shadow: 0 0 6px rgba(61, 242, 224, 0.5) !important;
      font-weight: 600;
    }

    .nav-tab.nav-tab--active::after,
    .nav-tab--active::after {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    .nav-tab:has(.nav-active-dot)::after {
      display: none;
    }

    .nav-active-dot {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #3DF2E0 !important;
      box-shadow: 0 0 8px #3DF2E0 !important;
    }
  </style>
</head>

<body>

  <div id="viewport" role="main" aria-label="Visual Search Results Grid Screen">

    <!-- Pop-up Toast Notification Component (Saved to Collection!) -->
    <div id="wow-toast-notification" class="wow-toast-notification" role="status" aria-live="polite">
      <span class="toast-check-icon material-symbols-outlined">check</span>
      <span class="toast-text">Saved to Collection!</span>
    </div>

    <!-- Top Fixed Search Header -->
    <header class="search-results-header">
      <div class="search-nav-row">
        <a href="dashboard.html" class="search-back-btn" id="search-results-back-btn"
          aria-label="Return to Dashboard Feed">
          <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        </a>
        <div class="search-active-capsule">
          <span class="material-symbols-outlined" style="color: var(--crimson); font-size: 18px;">search</span>
          <input type="text" id="search-results-input" placeholder="Search gourmet recipes..." autocomplete="off"
            aria-label="Refine search query" />
          <button class="search-clear-btn" id="search-clear-btn" aria-label="Clear query">
            <span class="material-symbols-outlined text-[18px]">close</span>
          </button>
        </div>
      </div>
      <div class="search-meta-bar">
        <div class="search-query-label" id="search-query-label">Results for <span>"All Recipes"</span></div>
        <span class="search-count-badge" id="search-results-count-badge">0 Found</span>
      </div>
    </header>

    <!-- Scrollable 2-Column Grid Canvas -->
    <main id="search-grid-scroll" class="no-scrollbar">
      <div class="search-results-grid" id="search-results-grid">
        <!-- Dynamically rendered via renderSearchResultsGrid() -->
      </div>
    </main>

    <!-- Persistent Bottom Navigation Bar -->
    <nav id="app-nav" aria-label="Main navigation">
      <!-- Tab 1: Home -->
      <a href="dashboard.html" class="nav-tab" id="nav-home" aria-label="Home Feed" data-tab="home">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
        <span class="nav-label">Home</span>
      </a>

      <!-- Tab 2: Explore — ACTIVE -->
      <a href="search-pantry.html" class="nav-tab nav-tab--active" id="nav-explore" aria-label="Explore & Search"
        aria-current="page" data-tab="explore">
        <span class="material-symbols-outlined" aria-hidden="true">explore</span>
        <span class="nav-label">Explore</span>
        <span class="nav-active-dot" aria-hidden="true"></span>
      </a>

      <!-- Tab 3: Pantry Scan -->
      <a href="pantry_scan.html" class="nav-tab" id="nav-scan" aria-label="Kitchen Ingredient Camera Scanner"
        data-tab="scan">
        <span class="material-symbols-outlined" aria-hidden="true">photo_camera</span>
        <span class="nav-label">Pantry Scan</span>
      </a>

      <!-- Tab 4: Collection -->
      <a href="collection.html" class="nav-tab" id="nav-collection" aria-label="Saved Recipes Collection"
        data-tab="collection">
        <span class="material-symbols-outlined" aria-hidden="true">bookmark</span>
        <span class="nav-label">Collection</span>
      </a>

      <!-- Tab 5: Grocery -->
      <a href="grocery.html" class="nav-tab" id="nav-grocery" aria-label="Smart Grocery List" data-tab="grocery">
        <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
        <span class="nav-label">Grocery</span>
      </a>

      <!-- Tab 6: Pro Chef -->
      <a href="chef-ai-showcase.html" class="nav-tab" id="nav-chef-ai" aria-label="Pro Chef AI Assistant"
        data-tab="chef-ai">
        <span class="material-symbols-outlined" aria-hidden="true">smart_toy</span>
        <span class="nav-label">Pro Chef</span>
      </a>
    </nav>

  </div><!-- /#viewport -->

  <!-- Global State Dynamic Parameter System & Routing Engine -->
  <script src="assets/recipe-system.js"></script>
  <!-- Central Dynamic Recipe Router & TheMealDB API Engine -->
  <script src="recipe-controller.js"></script>

  <!-- Visual Search Grid Logic -->
  <script>
    (function () {
      'use strict';

      var searchInput = document.getElementById('search-results-input');
      var searchClearBtn = document.getElementById('search-clear-btn');
      var searchQueryLabel = document.getElementById('search-query-label');
      var searchResultsCountBadge = document.getElementById('search-results-count-badge');
      var searchResultsGrid = document.getElementById('search-results-grid');

      async function executeSearch(query) {
        var cleanQuery = (query || '').toLowerCase().trim();
        if (searchQueryLabel) {
          searchQueryLabel.innerHTML = cleanQuery ? `Results for <span>"${query}"</span>` : `Results for <span>"All Recipes"</span>`;
        }
        if (searchResultsGrid) {
          searchResultsGrid.innerHTML = `
            <div style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px;">
              <div style="width: 28px; height: 28px; border: 3px solid rgba(61, 242, 224, 0.2); border-top-color: #3DF2E0; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
              <span style="font-size: 12px; color: #8E8E93; font-weight: 600;">Searching Chef AI Database...</span>
            </div>
          `;
        }

        var results = [];
        if (typeof window.searchRecipesMultipleAsync === 'function') {
          results = await window.searchRecipesMultipleAsync(cleanQuery);
        } else if (typeof window.searchRecipesAsync === 'function') {
          var single = await window.searchRecipesAsync(cleanQuery);
          results = [single];
        }

        if (searchResultsCountBadge) {
          searchResultsCountBadge.textContent = `${results.length} Found`;
        }

        if (typeof window.renderSearchResultsGrid === 'function' && searchResultsGrid) {
          window.renderSearchResultsGrid(results, searchResultsGrid, function (selectedRecipe) {
            window.openRecipeDetail(selectedRecipe);
          });
        }
      }

      if (searchInput) {
        searchInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            executeSearch(searchInput.value);
          }
        });
      }

      if (searchClearBtn) {
        searchClearBtn.addEventListener('click', function (e) {
          e.preventDefault();
          if (searchInput) {
            searchInput.value = '';
            searchInput.focus();
            executeSearch('');
          }
        });
      }

      // Initial Query from URL search params
      var urlParams = new URLSearchParams(window.location.search);
      var query = urlParams.get('q') || urlParams.get('search') || urlParams.get('query') || 'chicken';
      if (searchInput) {
        searchInput.value = query;
      }
      executeSearch(query);
    }());
  </script>

  <!-- Global Application State Engine -->
  <script src="app.js"></script>
  <!-- Global Viewport Controller Module -->
  <script src="assets/viewport-controller.js"></script>
  <!-- wow Chef AI Conversational Assistant Component -->
  <script src="assets/chef-ai.js"></script>
</body>

</html>
