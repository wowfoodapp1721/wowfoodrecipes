<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="wow Food Recipes — Kitchen Voice Assistant Calibration & Acoustic Setup.">
  <title>wow | Voice Sync Setup</title>

  <!-- Google Fonts: EB Garamond (Brand Serif) + Plus Jakarta Sans (UI body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Global Viewport Controller Stylesheet -->
  <link rel="stylesheet" href="assets/viewport-controller.css" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #0B0F14;
      --surface-charcoal: #1C1C1E;
      --surface-card: #161618;
      --crimson: #3DF2E0;
      --crimson-glow: rgba(61, 242, 224, 0.35);
      --emerald: #00E676;
      --emerald-glow: rgba(0, 230, 118, 0.4);
      --text-white: #FFFFFF;
      --text-muted: #8E8E93;
      --border-soft: rgba(255, 255, 255, 0.08);
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      min-height: 100%;
      background-color: var(--black);
      color: var(--text-white);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow-x: hidden;
    }

    .mobile-viewport {
      width: 393px;
      height: 852px;
      background-color: var(--black);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 44px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 32px 80px rgba(0, 0, 0, 0.95);
    }

    .fixed-header {
      width: 100%;
      padding: 20px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 15, 20, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      z-index: 10;
    }

    .btn-header-back {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-charcoal);
      border: 1px solid var(--border-soft);
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-header-back:hover {
      border-color: rgba(61, 242, 224, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(61, 242, 224, 0.2);
    }

    .header-title-text {
      font-size: 17px;
      font-weight: 700;
      color: white;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    /* Concentric Acoustic Waveform Radar */
    .acoustic-radar-box {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0 10px;
    }

    .radar-outer-wave {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(61, 242, 224, 0.3);
      animation: acousticPulse 2.5s ease-out infinite;
    }

    .radar-mid-wave {
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 1.5px solid rgba(61, 242, 224, 0.5);
      background: rgba(61, 242, 224, 0.08);
      animation: acousticPulse 2.5s ease-out infinite 0.4s;
    }

    @keyframes acousticPulse {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    .radar-inner-mic {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2A2A2E, #161618);
      border: 2px solid var(--crimson);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--crimson);
      box-shadow: 0 0 24px var(--crimson-glow);
    }

    .radar-inner-mic.calibrated {
      border-color: var(--emerald);
      color: var(--emerald);
      box-shadow: 0 0 24px var(--emerald-glow);
    }

    /* Decibel Metering Bar */
    .decibel-meter-box {
      width: 100%;
      background: var(--surface-card);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .db-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .db-bar-track {
      width: 100%;
      height: 8px;
      background: #242428;
      border-radius: 4px;
      overflow: hidden;
    }

    .db-bar-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, var(--emerald), var(--crimson));
      border-radius: 4px;
      transition: width 0.15s ease;
    }

    .diagnostic-copy {
      font-size: 13.5px;
      line-height: 1.55;
      color: #D1D1D6;
    }

    .diagnostic-copy strong {
      color: var(--crimson);
      font-weight: 700;
    }

    .fixed-footer {
      width: 100%;
      padding: 16px 20px 28px;
      display: flex;
      gap: 12px;
      background: rgba(11, 15, 20, 0.95);
      border-top: 1px solid var(--border-soft);
    }

    .btn-action {
      flex: 1;
      height: 48px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      text-decoration: none;
      font-family: var(--font-sans);
      transition: all 0.3s ease;
    }

    .btn-cancel {
      background: var(--surface-charcoal);
      border: 1px solid var(--border-soft);
      color: white;
    }

    .btn-cancel:hover {
      background: #28282B;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(61, 242, 224, 0.15);
    }

    .btn-test {
      background: #3DF2E0;
      color: #0B0F14;
      box-shadow: 0 4px 18px var(--crimson-glow);
    }

    .btn-test:hover {
      background: #20C5B5;
      color: #0B0F14;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(61, 242, 224, 0.35);
    }

    .btn-test:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body data-viewport-mode="immersive" class="viewport-immersive">

  <div class="mobile-viewport" role="main" aria-label="Kitchen Voice Calibration">

    <!-- Top Header -->
    <header class="fixed-header">
      <a href="cooking-guide.html" class="btn-header-back" aria-label="Return to Cooking Guide">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </a>
      <h1 class="header-title-text">Voice Sync Setup</h1>
      <div style="width:36px;"></div>
    </header>

    <!-- Content -->
    <div class="scroll-content">
      <div class="acoustic-radar-box">
        <div class="radar-outer-wave"></div>
        <div class="radar-mid-wave"></div>
        <div class="radar-inner-mic" id="mic-icon-node">
          <span class="material-symbols-outlined text-[36px]" id="mic-icon-glyph">mic</span>
        </div>
      </div>

      <div class="diagnostic-copy" id="status-instructions">
        Calibrating Kitchen Microphone... Stand near your device and say a clear command like <strong>"Next Step"</strong> or <strong>"Start Timer"</strong> to tune acoustic sensitivity.
      </div>

      <!-- Decibel Metering Card -->
      <div class="decibel-meter-box">
        <div class="db-header-row">
          <span>KITCHEN AMBIENT SIGNAL</span>
          <span id="db-level-text">-42 dB (Optimal)</span>
        </div>
        <div class="db-bar-track">
          <div class="db-bar-fill" id="db-meter-fill"></div>
        </div>
      </div>
    </div>

    <!-- Pinned Footer Actions -->
    <footer class="fixed-footer">
      <a href="cooking-guide.html" class="btn-action btn-cancel">Cancel</a>
      <button class="btn-action btn-test" id="btn-run-calibration" type="button">Test Audio Signal</button>
    </footer>

  </div>

  <script>
    (function () {
      var btnCalibrate = document.getElementById('btn-run-calibration');
      var micNode = document.getElementById('mic-icon-node');
      var micGlyph = document.getElementById('mic-icon-glyph');
      var statusCopy = document.getElementById('status-instructions');
      var dbFill = document.getElementById('db-meter-fill');
      var dbText = document.getElementById('db-level-text');

      var isCalibrating = false;

      // Simulate live audio meter fluctuation
      setInterval(function () {
        if (!isCalibrating) {
          var val = Math.floor(Math.random() * 25) + 35;
          dbFill.style.width = val + '%';
        }
      }, 300);

      btnCalibrate.addEventListener('click', function () {
        isCalibrating = true;
        btnCalibrate.disabled = true;
        btnCalibrate.textContent = 'Calibrating Audio...';
        statusCopy.innerHTML = '<span style="color:var(--emerald); font-weight:700;">Listening for test phrase...</span> Speak "Next Step" now.';

        // Rapid metering animation
        dbFill.style.width = '85%';
        dbText.textContent = '-12 dB (Signal Detected)';

        setTimeout(function () {
          micNode.classList.add('calibrated');
          micGlyph.textContent = 'check_circle';
          statusCopy.innerHTML = '<strong style="color:var(--emerald);">Calibration Complete!</strong> Kitchen microphone acoustic profile synchronized with 99.4% accuracy.';
          btnCalibrate.textContent = 'Return to Cook Mode';
          btnCalibrate.style.backgroundColor = 'var(--emerald)';
          btnCalibrate.disabled = false;

          btnCalibrate.onclick = function () {
            window.location.href = 'cooking-guide.html?voice=calibrated';
          };
        }, 1800);
      });
    })();
  </script>

  <!-- Global Viewport Controller Module -->
  <script src="assets/viewport-controller.js"></script>

</body>
</html>
