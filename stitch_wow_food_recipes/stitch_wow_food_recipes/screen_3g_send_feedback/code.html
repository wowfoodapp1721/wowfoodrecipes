<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Screen 3G - Send Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000000;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between selection:bg-red-500/30">
  <!-- Mobile Container (390px native mobile viewport frame) -->
  <div class="w-full max-w-[390px] mx-auto min-h-screen flex flex-col justify-between bg-black relative px-5 pt-7 pb-4">
    
    <!-- Top Content Area -->
    <div class="w-full flex flex-col">
      
      <!-- Top Navigation Header -->
      <header class="flex items-center gap-4 pt-1 pb-6">
        <button type="button" aria-label="Go back" class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-white hover:bg-white/10 active:scale-95 transition-all">
          <svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <h1 class="text-[22px] font-bold tracking-tight text-white select-none">Send feedback</h1>
      </header>

      <!-- Recipe Summary / Context Card -->
      <section class="w-full bg-[#1C1C1E] rounded-2xl p-3.5 flex items-center gap-3.5 mb-7 border border-white/5 shadow-md">
        <!-- Recipe Thumbnail Image -->
        <div class="w-[68px] h-[68px] rounded-xl overflow-hidden bg-black/40 flex-shrink-0 border border-white/10">
          <img 
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuActbTdWDwGGap2JkGS9fpo27ncUNzupRknsemfPEfNKFVHqkOOfJW6mL8gBK4a1AIn93ApJrbkG6bZkCTfWobKqTBTd0ZibLcLdxGcgCDIUAUH7HGm3D6JeAT7rSu2AkxEQtwTtpXRNEK1x5CfesfTyBDmirHd01MZRh5y-wXzm1d_xFOCJlCxp4wXYXIEjoq6Bv92Ypy4AtRK_17SveF6e4wMKdfLNoGUOXTTsZHaKKq2s8t5TlRKrA" 
            alt="Chefchosen's Lamb Chops" 
            class="w-full h-full object-cover object-center transform hover:scale-105 transition-transform duration-300"
          />
        </div>

        <!-- Recipe Meta Text -->
        <div class="flex flex-col justify-center min-w-0 pr-1">
          <span class="text-[13px] font-medium text-[#8E8E93] leading-tight mb-1">Tell us a bit more</span>
          <h2 class="text-[17px] font-bold text-white tracking-tight truncate leading-snug">Chefchosen's Lamb Chops</h2>
        </div>
      </section>

      <!-- Feedback Category Options List -->
      <nav aria-label="Feedback options list" class="w-full flex flex-col divide-y divide-[#2C2C2E]/60 border-t border-b border-[#2C2C2E]/60">
        
        <!-- Option 1 -->
        <a href="#" class="group flex items-center justify-between py-4 px-1 hover:bg-white/[0.03] active:bg-white/[0.06] transition-colors">
          <span class="text-[16px] font-medium text-white group-hover:text-white/90">Issue with title</span>
          <svg class="w-5 h-5 text-[#8E8E93] group-hover:text-white group-hover:translate-x-0.5 transition-all stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <!-- Option 2 -->
        <a href="#" class="group flex items-center justify-between py-4 px-1 hover:bg-white/[0.03] active:bg-white/[0.06] transition-colors">
          <span class="text-[16px] font-medium text-white group-hover:text-white/90">Issue with ingredients</span>
          <svg class="w-5 h-5 text-[#8E8E93] group-hover:text-white group-hover:translate-x-0.5 transition-all stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <!-- Option 3 -->
        <a href="#" class="group flex items-center justify-between py-4 px-1 hover:bg-white/[0.03] active:bg-white/[0.06] transition-colors">
          <span class="text-[16px] font-medium text-white group-hover:text-white/90">Issue with instructions</span>
          <svg class="w-5 h-5 text-[#8E8E93] group-hover:text-white group-hover:translate-x-0.5 transition-all stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <!-- Option 4 -->
        <a href="#" class="group flex items-center justify-between py-4 px-1 hover:bg-white/[0.03] active:bg-white/[0.06] transition-colors">
          <span class="text-[16px] font-medium text-white group-hover:text-white/90">Issue with photo</span>
          <svg class="w-5 h-5 text-[#8E8E93] group-hover:text-white group-hover:translate-x-0.5 transition-all stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <!-- Option 5 -->
        <a href="#" class="group flex items-center justify-between py-4 px-1 hover:bg-white/[0.03] active:bg-white/[0.06] transition-colors">
          <span class="text-[16px] font-medium text-white group-hover:text-white/90">Report spam</span>
          <svg class="w-5 h-5 text-[#8E8E93] group-hover:text-white group-hover:translate-x-0.5 transition-all stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <!-- Option 6 -->
        <a href="#" class="group flex items-center justify-between py-4 px-1 hover:bg-white/[0.03] active:bg-white/[0.06] transition-colors">
          <span class="text-[16px] font-medium text-white group-hover:text-white/90">Other</span>
          <svg class="w-5 h-5 text-[#8E8E93] group-hover:text-white group-hover:translate-x-0.5 transition-all stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </a>

      </nav>
    </div>

    <!-- Bottom Navigation Pill Bar (Android Home Indicator) -->
    <div class="w-full flex justify-center items-center pt-8 pb-1">
      <div class="w-[136px] h-[5px] bg-white/40 rounded-full"></div>
    </div>

  </div>
</body>
</html>
