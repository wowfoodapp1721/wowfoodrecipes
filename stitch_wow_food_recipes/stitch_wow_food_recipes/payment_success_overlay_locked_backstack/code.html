<div class="absolute bottom-[-10%] right-[-10%] w-[45%] h-[45%] blur-[120px] rounded-full" style="background-color: rgba(255, 59, 48, 0.12);"></div>
</div>
<script>
  // 1. Back-stack locking & history prevention
  (function enforceBackStackLocking() {
    // Push an anchor state so attempting back stays on page
    window.history.pushState({ page: 'payment-success-locked' }, '', window.location.href);

    let toastTimer = null;
    function showBackLockToast() {
      const toast = document.getElementById('backNavToast');
      if (!toast) return;
      toast.classList.remove('-translate-y-16', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('-translate-y-16', 'opacity-0', 'pointer-events-none');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    // Intercept back navigation
    window.addEventListener('popstate', function (event) {
      // Re-push locked state immediately
      window.history.pushState({ page: 'payment-success-locked' }, '', window.location.href);
      showBackLockToast();
    });
  })();

  // 2. 'EXPLORE PREMIUM RECIPES' action: route cleanly to home dashboard clearing backstack
  document.getElementById('exploreRecipesBtn')?.addEventListener('click', function() {
    const btn = this;
    btn.style.transform = 'scale(0.97)';
    btn.style.opacity = '0.85';

    // Transition smoothly and replace history back-stack cache
    setTimeout(function() {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname.replace(/[^/]*$/, '') || '/');
      }
      // Simulate/perform direct navigation to Home Dashboard
      window.location.replace('#dashboard');
    }, 150);
  });
</script>
