<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Screen 4A - Saved Recipes Gallery</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#FF3B30',
            surface: '#1C1C1E',
            muted: '#8E8E93',
          }
        }
      }
    }
  </script>
<!-- Custom Scrollbar Suppression & Core Reset -->
<style data-purpose="viewport-styling">
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-black antialiased selection:bg-red-500 selection:text-white">
<!-- BEGIN: MobileContainer -->
<div class="relative w-full max-w-[390px] h-screen bg-black flex flex-col overflow-hidden select-none border-x border-white/5 shadow-2xl" data-purpose="app-viewport">
<!-- BEGIN: TopBar -->
<header class="flex-shrink-0 z-20 bg-black/80 backdrop-blur-md pt-2">
<!-- iOS Status Bar Simulation -->
<div class="flex justify-between items-center px-6 py-2 text-white text-xs font-semibold tracking-tight" data-purpose="status-bar">
<span class="text-[14px]">9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 17 12">
<rect height="3" rx="0.5" width="2.5" x="0" y="9"></rect>
<rect height="6" rx="0.5" width="2.5" x="4" y="6"></rect>
<rect height="9" rx="0.5" width="2.5" x="8" y="3"></rect>
<rect height="12" rx="0.5" width="2.5" x="12" y="0"></rect>
</svg>
<!-- Wifi Signal -->
<svg class="w-4 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 2.85c3.84 0 7.33 1.54 9.87 4.04L12 18.84 2.13 10.89C4.67 8.39 8.16 6.85 12 6.85z"></path>
</svg>
<!-- Battery Level -->
<div class="w-6 h-3 rounded-sm border border-white/70 p-0.5 flex items-center">
<div class="h-full w-4/5 bg-white rounded-2xs"></div>
</div>
</div>
</div>
<!-- Main Navigation Header -->
<div class="px-4 py-2.5 flex items-center justify-center relative" data-purpose="screen-title">
<h1 class="text-white text-lg font-semibold tracking-tight">Saved Recipes</h1>
</div>
<!-- BEGIN: FilterPills -->
<nav class="px-4 py-2.5 flex items-center space-x-2 overflow-x-auto no-scrollbar" data-purpose="recipe-filter-tabs">
<!-- Pill 1 (Active) -->
<button aria-current="page" class="flex-shrink-0 px-4 py-1.5 rounded-full bg-brand text-white text-xs font-semibold shadow-sm transition-transform active:scale-95" type="button">
          All (12)
        </button>
<!-- Pill 2 (Inactive) -->
<button class="flex-shrink-0 px-4 py-1.5 rounded-full bg-surface text-neutral-400 text-xs font-medium border border-white/10 hover:text-white transition-colors active:scale-95" type="button">
          Entrees (7)
        </button>
<!-- Pill 3 (Inactive) -->
<button class="flex-shrink-0 px-4 py-1.5 rounded-full bg-surface text-neutral-400 text-xs font-medium border border-white/10 hover:text-white transition-colors active:scale-95" type="button">
          Quick &amp; Easy (5)
        </button>
</nav>
<!-- END: FilterPills -->
</header>
<!-- END: TopBar -->
<!-- BEGIN: RecipeFeed -->
<main class="flex-1 overflow-y-auto no-scrollbar px-4 pt-2 pb-28 space-y-4" data-purpose="recipe-cards-container">
<!-- Recipe Card 1: Honey Sesame Chicken -->
<article class="bg-surface rounded-2xl overflow-hidden border border-white/10 shadow-lg group transition hover:border-white/20" data-purpose="recipe-card">
<!-- Thumbnail Container -->
<div class="relative w-full h-44 bg-neutral-900 overflow-hidden">
<img alt="Crispy Honey Sesame Chicken" class="w-full h-full object-cover transform transition duration-500 group-hover:scale-105" loading="lazy" src="https://lh3.googleusercontent.com/aida/AEtjO1WCmy_gwguUOh4d8PmdioCm4X1F5QCUk34eHxlBDTZclV7ncx9YvdSOCShpEYcP3IKH8OOIMxxjaUGXpWMNjCSF9dT4C0Qzmaeanjc2e3L8ECoYJ18JMjMcBv2Vman9y3Byb5LLIP25D6vnu8nOfR4NSdF4Zg1hASOjf_gk2CdwPSRnUepClVxEJf_MfbPM45b1j3UoyRvrL-xPgP5BJ5lbu1KIzFuPc8gcL6WmBq_1DHfDonW-OMgb2wz0">
</div>
<!-- Card Details -->
<div class="p-4 flex items-start justify-between">
<div class="pr-2">
<h2 class="text-white text-base font-semibold tracking-tight">Honey Sesame Chicken</h2>
<div class="flex items-center text-xs text-neutral-400 mt-1 space-x-1.5 font-normal">
<!-- Clock / Timer Icon -->
<svg class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke-width="2"></circle>
<path d="M12 6v6l3 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="">30 Min</span>
<span class="text-neutral-600 font-bold">•</span>
<span class="">Serves 4</span>
</div>
</div>
<!-- Bookmark Action Button -->
<button aria-label="Remove from saved recipes" class="w-9 h-9 flex items-center justify-center rounded-full bg-neutral-800/80 border border-white/5 flex-shrink-0 active:scale-90 transition-transform focus:outline-none" type="button">
<svg class="w-4 h-4 fill-[#FF3B30] text-[#FF3B30]" viewBox="0 0 24 24">
<path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"></path>
</svg>
</button>
</div>
</article>
<!-- Recipe Card 2: Spaghetti Carbonara -->
<article class="bg-surface rounded-2xl overflow-hidden border border-white/10 shadow-lg group transition hover:border-white/20" data-purpose="recipe-card">
<!-- Thumbnail Container -->
<div class="relative w-full h-44 bg-neutral-900 overflow-hidden">
<img alt="Spaghetti Carbonara" class="w-full h-full object-cover transform transition duration-500 group-hover:scale-105" loading="lazy" src="https://lh3.googleusercontent.com/aida/AEtjO1UjvI3rzhYSzZhYtLp2w_8_jXF5yLgJoQzM5IuyQ5NWFikJeUISToj9OjzkqkYDDEonOKa_UCbxg8RquLI9f5vS8J9Q0KuFj1Q9R_75CvXwUrnAeXxXveo2ikcW0kF3Ii4TfwI_zNK9Hoc_sjULkFtRDnPYrWrxyxvmTtz4lBuJZizTtnMxfxo7sryqijGJxem6hHqYyrA9qC8Q4BhjbcUNiLfuRTEKy-tOD-N4nHoC3vGfuBv8fhcd45fD">
</div>
<!-- Card Details -->
<div class="p-4 flex items-start justify-between">
<div class="pr-2">
<h2 class="text-white text-base font-semibold tracking-tight">Spaghetti Carbonara</h2>
<div class="flex items-center text-xs text-neutral-400 mt-1 space-x-1.5 font-normal">
<!-- Clock / Timer Icon -->
<svg class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke-width="2"></circle>
<path d="M12 6v6l3 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="">20 Min</span>
<span class="text-neutral-600 font-bold">•</span>
<span class="">Serves 2</span>
</div>
</div>
<!-- Bookmark Action Button -->
<button aria-label="Remove from saved recipes" class="w-9 h-9 flex items-center justify-center rounded-full bg-neutral-800/80 border border-white/5 flex-shrink-0 active:scale-90 transition-transform focus:outline-none" type="button">
<svg class="w-4 h-4 fill-[#FF3B30] text-[#FF3B30]" viewBox="0 0 24 24">
<path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"></path>
</svg>
</button>
</div>
</article>
</main>
<!-- END: RecipeFeed -->
<!-- BEGIN: BottomNavigation -->
<footer class="absolute bottom-0 inset-x-0 bg-black/90 backdrop-blur-md border-t border-white/10 z-30" data-purpose="bottom-tab-bar">
<div class="px-6 py-2.5 flex items-center justify-between">
<!-- Tab 1: Home -->
<a class="flex flex-col items-center justify-center space-y-1 text-muted transition hover:text-white group" href="#home">
<svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Home</span>
</a>
<!-- Tab 2: Explore -->
<a class="flex flex-col items-center justify-center space-y-1 text-muted transition hover:text-white group" href="#explore">
<svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Explore</span>
</a>
<!-- Tab 3: Saved (Active) -->
<a aria-current="page" class="flex flex-col items-center justify-center space-y-1 text-white group" href="#saved">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"></path>
</svg>
<span class="text-[10px] font-semibold tracking-tight">Saved</span>
</a>
<!-- Tab 4: Profile -->
<a class="flex flex-col items-center justify-center space-y-1 text-muted transition hover:text-white group" href="#profile">
<svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Profile</span>
</a>
</div>
<!-- iOS / Android Virtual Home Bar -->
<div class="w-full flex justify-center pb-1.5 pt-0.5" data-purpose="navigation-indicator">
<div class="w-32 h-1 bg-white/20 rounded-full"></div>
</div>
</footer>
<!-- END: BottomNavigation -->
</div>
<!-- END: MobileContainer -->


</body></html>
