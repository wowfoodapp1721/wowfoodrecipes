<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_54 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_54" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_54');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('threejs-container') || document.body;
const width = container.clientWidth || 360;
const height = container.clientHeight || 360;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 210;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Particle Sphere representing Sonic Mandala / Vedic Audio Pulse
const particleCount = 1200;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const originalPositions = new Float32Array(particleCount * 3);

const colorInner = new THREE.Color(0xff9900); // Fiery saffron-orange
const colorOuter = new THREE.Color(0xd92638); // Warm crimson-red
const colorCore = new THREE.Color(0xffcc00);  // Radiant Vedic gold

for (let i = 0; i < particleCount; i++) {
  // Spherical distribution with Fibonacci spiral
  const phi = Math.acos(-1 + (2 * i) / particleCount);
  const theta = Math.sqrt(particleCount * Math.PI) * phi;
  const radius = 68 + (Math.random() * 8 - 4);

  const x = radius * Math.cos(theta) * Math.sin(phi);
  const y = radius * Math.sin(theta) * Math.sin(phi);
  const z = radius * Math.cos(phi);

  positions[i * 3] = x;
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = z;

  originalPositions[i * 3] = x;
  originalPositions[i * 3 + 1] = y;
  originalPositions[i * 3 + 2] = z;

  // Normalized distance for radial color interpolation (saffron to crimson)
  const normDist = (radius - 64) / 16;
  const pColor = new THREE.Color();
  if (Math.random() > 0.85) {
    pColor.copy(colorCore);
  } else {
    pColor.lerpColors(colorInner, colorOuter, Math.min(Math.max(normDist + (Math.sin(i) * 0.3), 0), 1));
  }

  colors[i * 3] = pColor.r;
  colors[i * 3 + 1] = pColor.g;
  colors[i * 3 + 2] = pColor.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// Particle texture dot
const canvas = document.createElement('canvas');
canvas.width = 32;
canvas.height = 32;
const ctx = canvas.getContext('2d');
const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.3, 'rgba(255,180,60,0.85)');
grad.addColorStop(0.7, 'rgba(217,38,56,0.35)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = grad;
ctx.beginPath();
ctx.arc(16, 16, 16, 0, Math.PI * 2);
ctx.fill();

const texture = new THREE.CanvasTexture(canvas);
const pMaterial = new THREE.PointsMaterial({
  size: 4.8,
  map: texture,
  vertexColors: true,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const particleSystem = new THREE.Points(geometry, pMaterial);
scene.add(particleSystem);

// Concentric delicate Vedic resonance rings
const ringsGroup = new THREE.Group();
const ringColors = [0xffaa00, 0xd92638, 0x10b981];
for (let r = 0; r < 3; r++) {
  const ringGeo = new THREE.RingGeometry(72 + r * 14, 73 + r * 14, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: ringColors[r],
    transparent: true,
    opacity: 0.28 - r * 0.07,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 + (r * 0.25);
  ring.rotation.y = r * 0.35;
  ringsGroup.add(ring);
}
scene.add(ringsGroup);

let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  particleSystem.rotation.y = t * 0.28;
  particleSystem.rotation.x = Math.sin(t * 0.2) * 0.2;
  ringsGroup.rotation.z = t * 0.15;
  ringsGroup.rotation.y = Math.cos(t * 0.18) * 0.25;

  const posAttr = geometry.attributes.position;
  const arr = posAttr.array;

  for (let i = 0; i < particleCount; i++) {
    const idx = i * 3;
    const ox = originalPositions[idx];
    const oy = originalPositions[idx + 1];
    const oz = originalPositions[idx + 2];

    // Audio waveform pulsing wave
    const wave = Math.sin(t * 3.8 + ox * 0.04 + oy * 0.05 + oz * 0.03) * 6.5;
    const pulse = 1.0 + Math.sin(t * 2.2) * 0.06;

    arr[idx] = ox * pulse + (ox / 70) * wave;
    arr[idx + 1] = oy * pulse + (oy / 70) * wave;
    arr[idx + 2] = oz * pulse + (oz / 70) * wave;
  }
  posAttr.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const newW = container.clientWidth || 360;
  const newH = container.clientHeight || 360;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_54 -->
</body></html>
