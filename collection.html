<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>wow | My Saved Recipes Collection</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Core Viewport Controller & Universal Styles -->
  <link rel="stylesheet" href="assets/viewport-controller.css" />
  <!-- wow Chef AI Drawer Component Stylesheet -->
  <link rel="stylesheet" href="assets/chef-ai.css" />

  <style>
    :root {
      --bg-void: #0B0F14;
      --card-bg: #121820;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --neon-cyan: #3DF2E0;
      --neon-cyan-glow: rgba(61, 242, 224, 0.35);
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #05080C;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #viewport {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 932px;
      background-color: var(--bg-void);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
    }

    /* Top Sticky Header */
    .collection-top-bar {
      flex-shrink: 0;
      background: rgba(11, 15, 20, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .top-bar-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .top-bar-left {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-width: 0;
      margin: 0;
      padding: 0;
    }

    .header-icon-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(61, 242, 224, 0.12);
      border: 1px solid rgba(61, 242, 224, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--neon-cyan);
      flex-shrink: 0;
      margin: 0;
      line-height: 1;
    }

    .header-icon-badge .material-symbols-outlined {
      font-size: 18px;
    }

    .header-page-title {
      display: flex;
      flex-direction: row;
      white-space: nowrap;
      align-items: center;
      justify-content: flex-start;
      margin: 0;
      padding: 0;
      text-transform: lowercase;
      line-height: 1;
      flex-shrink: 0;
    }

    .header-page-title .brand-wow {
      color: #FFFFFF;
      font-family: 'Britannic Bold', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-style: italic;
      font-size: 26px;
      font-weight: 900;
      margin-right: 5px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }

    .header-page-title .sub-title {
      color: #3DF2E0;
      font-family: 'Britannic Bold', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-style: italic;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(61, 242, 224, 0.5);
      line-height: 1;
      display: inline-flex;
      align-items: center;
    }

    .header-count-pill {
      font-size: 11px;
      font-weight: 700;
      color: var(--neon-cyan);
      background: rgba(61, 242, 224, 0.12);
      border: 1px solid rgba(61, 242, 224, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      flex-shrink: 0;
      margin: 0;
    }

    .back-btn-pill {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #18181A;
      border: 1px solid var(--border-subtle);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.15s;
      flex-shrink: 0;
      margin: 0;
      line-height: 1;
    }

    .back-btn-pill:hover {
      background: #242428;
      transform: scale(1.05);
    }

    .back-btn-pill:active {
      transform: scale(0.95);
    }

    /* Filter Category Pills */
    .filter-pills-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .filter-pills-row::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: #18181A;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 6px 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .filter-pill:hover {
      color: #FFFFFF;
      border-color: rgba(61, 242, 224, 0.3);
    }

    .filter-pill.active {
      color: #0B0F14;
      background: var(--neon-cyan);
      border-color: var(--neon-cyan);
      font-weight: 700;
      box-shadow: 0 2px 12px rgba(61, 242, 224, 0.4);
    }

    /* Main Scrollable Canvas */
    #collection-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 110px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      background-color: var(--bg-void);
    }

    #collection-canvas::-webkit-scrollbar {
      display: none;
    }

    .collection-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    /* ══════════════════════════════════════════════════════════════════
       SAVED RECIPE CARD & DUAL-LAYER IMAGE RENDERING CONTAINER
       ══════════════════════════════════════════════════════════════════ */
    .search-grid-card {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .search-grid-card:hover {
      border-color: rgba(61, 242, 224, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 16px rgba(61, 242, 224, 0.25);
    }

    .search-grid-card:active {
      transform: scale(0.98);
    }

    /* 1. Image Container Layer hosting the view of the saved recipe card */
    .search-card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: #070B0E;
      border-radius: 18px 18px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Layer 1 (Backdrop): Duplicate scale stretched fully with heavy CSS blur filter */
    .search-card-thumb-backdrop {
      position: absolute;
      inset: -20px;
      width: calc(100% + 40px);
      height: calc(100% + 40px);
      object-fit: cover;
      object-position: center center;
      background-size: cover;
      background-position: center center;
      filter: blur(20px) brightness(0.6);
      transform: scale(1.15);
      pointer-events: none;
      z-index: 1;
    }

    /* Layer 2 (Foreground Showcase): Actual unblurred recipe food image crisp and centered */
    .search-card-thumb {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      background-size: cover;
      background-position: center center;
      display: block;
      z-index: 2;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-grid-card:hover .search-card-thumb {
      transform: scale(1.04);
    }

    .search-card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(11, 15, 20, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(61, 242, 224, 0.4);
      color: var(--neon-cyan);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      z-index: 3;
    }

    .search-card-content {
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 14px;
      box-sizing: border-box;
      background-color: var(--card-bg);
      border-radius: 0 0 18px 18px;
    }

    .search-card-info-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .search-card-title {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-card-metrics {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .search-metric-pill .material-symbols-outlined {
      font-size: 14px;
      color: var(--neon-cyan);
    }

    /* Bottom Navigation Bar with Collection Active (Neon Cyan #3DF2E0) */
    #app-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 76px;
      z-index: 50;
      background-color: rgba(11, 15, 20, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-soft, rgba(255, 255, 255, 0.1));
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px 12px;
      box-sizing: border-box;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 52px;
      padding: 2px 2px;
      flex: 1;
      min-width: 0;
      color: #6D6D72;
      transition: all 0.25s ease-in-out;
      position: relative;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-tab:active {
      transform: scale(0.95);
    }

    .nav-tab .material-symbols-outlined {
      font-size: 22px;
      line-height: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease-in-out;
    }

    .nav-tab .nav-label,
    .nav-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.2;
      margin-top: 3px;
      white-space: nowrap;
      text-align: center;
      transition: all 0.25s ease-in-out;
    }

    /* Micro-Indicator Dot Glow (4px Neon Cyan circular dot) */
    .nav-tab::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #3DF2E0;
      box-shadow: 0 0 8px #3DF2E0;
      opacity: 0;
      transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out;
      pointer-events: none;
    }

    /* Interactive Hover & Focus States (Neon Cyan Glow) */
    .nav-tab:hover,
    .nav-tab:focus-visible {
      color: #3DF2E0;
    }

    .nav-tab:hover .material-symbols-outlined,
    .nav-tab:focus-visible .material-symbols-outlined {
      color: #3DF2E0;
      filter: drop-shadow(0 0 6px rgba(61, 242, 224, 0.7));
      transform: scale(1.08);
    }

    .nav-tab:hover .nav-label,
    .nav-tab:focus-visible .nav-label {
      color: #3DF2E0;
      text-shadow: 0 0 6px rgba(61, 242, 224, 0.5);
    }

    .nav-tab:hover::after,
    .nav-tab:focus-visible::after {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    /* Active Selected State - Locked in Solid Neon Cyan */
    .nav-tab.nav-tab--active,
    .nav-tab--active {
      color: #3DF2E0 !important;
    }

    .nav-tab.nav-tab--active .material-symbols-outlined,
    .nav-tab--active .material-symbols-outlined {
      color: #3DF2E0 !important;
      filter: drop-shadow(0 0 6px rgba(61, 242, 224, 0.7)) !important;
    }

    .nav-tab.nav-tab--active .nav-label,
    .nav-tab--active .nav-label {
      color: #3DF2E0 !important;
      text-shadow: 0 0 6px rgba(61, 242, 224, 0.5) !important;
      font-weight: 600;
    }

    .nav-tab.nav-tab--active::after,
    .nav-tab--active::after {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    .nav-tab:has(.nav-active-dot)::after {
      display: none;
    }

    .nav-active-dot {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #3DF2E0 !important;
      box-shadow: 0 0 8px #3DF2E0 !important;
    }

    /* ══════════════════════════════════════════════════════════════════
       PREMIUM FLOATING AI COMPONENT: Circular FAB in Bottom-Right Corner
       ══════════════════════════════════════════════════════════════════ */
    .wow-chef-ai-fab {
      position: absolute !important;
      bottom: 84px !important;
      right: 18px !important;
      left: auto !important;
      transform: none !important;
      z-index: 40 !important;
      width: 52px !important;
      height: 52px !important;
      min-width: 52px !important;
      min-height: 52px !important;
      border-radius: 50% !important;
      background: rgba(18, 24, 32, 0.92) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1.5px solid #3DF2E0 !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 16px rgba(61, 242, 224, 0.4) !important;
      color: #FFFFFF !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      outline: none !important;
      padding: 0 !important;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    .wow-chef-ai-fab:hover {
      transform: translateY(-3px) scale(1.06) !important;
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.85), 0 0 22px rgba(61, 242, 224, 0.6) !important;
      border-color: #3DF2E0 !important;
    }

    .wow-chef-ai-fab:active {
      transform: scale(0.94) !important;
    }

    .wow-chef-ai-fab .chef-fab-label,
    .wow-chef-ai-fab .chef-fab-sparkle {
      display: none !important;
    }

    .wow-chef-ai-fab .chef-fab-avatar {
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      position: relative !important;
    }

    .wow-chef-ai-fab .chef-fab-avatar .material-symbols-outlined {
      font-size: 26px !important;
      color: #3DF2E0 !important;
    }

    .wow-chef-ai-fab .chef-fab-pulse {
      position: absolute !important;
      top: 8px !important;
      right: 8px !important;
      width: 8px !important;
      height: 8px !important;
      border-radius: 50% !important;
      background: #3DF2E0 !important;
      box-shadow: 0 0 8px #3DF2E0, 0 0 12px rgba(61, 242, 224, 0.8) !important;
    }
  </style>
</head>

<body>
  <div id="viewport">

    <!-- Screen 9 Top Header -->
    <header class="collection-top-bar" role="banner">
      <div class="top-bar-row">
        <div class="top-bar-left">
          <a href="dashboard.html" class="back-btn-pill" aria-label="Return to Dashboard Feed">
            <span class="material-symbols-outlined text-[19px]">arrow_back</span>
          </a>
          <div class="header-icon-badge">
            <span class="material-symbols-outlined">bookmark</span>
          </div>
          <h1 class="header-page-title">
            <span class="brand-wow">wow</span>
            <span class="sub-title">collections</span>
          </h1>
        </div>
        <span class="header-count-pill" id="collection-count-badge">0 Saved</span>
      </div>

      <!-- Filter Categories -->
      <nav class="filter-pills-row" aria-label="Collection Categories">
        <button class="filter-pill active" onclick="filterCategory('all', this)">All Saved</button>
        <button class="filter-pill" onclick="filterCategory('poultry', this)">Poultry</button>
        <button class="filter-pill" onclick="filterCategory('pasta', this)">Pasta</button>
        <button class="filter-pill" onclick="filterCategory('seafood', this)">Seafood</button>
        <button class="filter-pill" onclick="filterCategory('comfort', this)">Comfort</button>
        <button class="filter-pill" onclick="filterCategory('pizza', this)">Pizza &amp; Flatbreads</button>
        <button class="filter-pill" onclick="filterCategory('burgers', this)">Burgers &amp; Sliders</button>
        <button class="filter-pill" onclick="filterCategory('snacks', this)">Snacks &amp; Starters</button>
        <button class="filter-pill" onclick="filterCategory('breakfast', this)">Breakfast &amp; Brunch</button>
        <button class="filter-pill" onclick="filterCategory('desserts', this)">Desserts &amp; Baking</button>
        <button class="filter-pill" onclick="filterCategory('15-min', this)">⚡ Under 15 Mins</button>
        <button class="filter-pill" onclick="filterCategory('30-min', this)">⚡ Under 30 Mins</button>
        <button class="filter-pill" onclick="filterCategory('fridge', this)">🤖 In My Fridge</button>
      </nav>
    </header>

    <!-- Scrollable Screen 9 Grid Canvas -->
    <main id="collection-canvas" class="no-scrollbar">
      <div class="collection-grid" id="collection-grid">
        <!-- Dynamically hydrated via renderSavedCollection() -->
      </div>
    </main>

    <!-- Bottom Navigation Bar with Collection Active (Neon Cyan #3DF2E0) -->
    <nav id="app-nav" aria-label="Main application navigation">
      <!-- Tab 1: Home -->
      <a href="dashboard.html" class="nav-tab" id="nav-home" aria-label="Home Feed" data-tab="home">
        <span class="material-symbols-outlined" aria-hidden="true">home</span>
        <span class="nav-label">Home</span>
      </a>

      <!-- Tab 2: Explore -->
      <a href="search-pantry.html" class="nav-tab" id="nav-explore" aria-label="Explore & Search" data-tab="explore">
        <span class="material-symbols-outlined" aria-hidden="true">explore</span>
        <span class="nav-label">Explore</span>
      </a>

      <!-- Tab 3: Pantry Scan (Positioned between Explore and Collection) -->
      <a href="pantry_scan.html" class="nav-tab" id="nav-scan" aria-label="Kitchen Ingredient Camera Scanner" data-tab="scan">
        <span class="material-symbols-outlined" aria-hidden="true">photo_camera</span>
        <span class="nav-label">Pantry Scan</span>
      </a>

      <!-- Tab 4: Collection — ACTIVE (Neon Cyan #3DF2E0) -->
      <a href="collection.html" class="nav-tab nav-tab--active" id="nav-collection" aria-label="Saved Recipes Collection (Current)" aria-current="page" data-tab="collection">
        <span class="material-symbols-outlined" aria-hidden="true">bookmark</span>
        <span class="nav-label">Collection</span>
        <span class="nav-active-dot" aria-hidden="true"></span>
      </a>

      <!-- Tab 5: Grocery -->
      <a href="grocery.html" class="nav-tab" id="nav-grocery" aria-label="Smart Grocery List" data-tab="grocery">
        <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
        <span class="nav-label">Grocery</span>
      </a>

      <!-- Tab 6: Pro Chef -->
      <a href="chef-ai-showcase.html" class="nav-tab" id="nav-chef-ai" aria-label="Pro Chef AI Assistant" data-tab="chef-ai">
        <span class="material-symbols-outlined" aria-hidden="true">smart_toy</span>
        <span class="nav-label">Pro Chef</span>
      </a>
    </nav>

  </div><!-- /#viewport -->

  <!-- Global State Dynamic Parameter System & Routing Engine -->
  <script src="assets/recipe-system.js"></script>
  <!-- Central Dynamic Recipe Router -->
  <script src="recipe-controller.js"></script>
  <!-- Global Application State Engine -->
  <script src="app.js"></script>
  <!-- Global Viewport Controller Module -->
  <script src="assets/viewport-controller.js"></script>
  <!-- wow Chef AI Conversational Assistant Component -->
  <script src="assets/chef-ai.js"></script>

  <script>
    (function () {
      'use strict';

      var currentFilter = 'all';

      window.filterCategory = function (categoryKey, btnEl) {
        currentFilter = categoryKey;
        var pills = document.querySelectorAll('.filter-pill');
        pills.forEach(function (p) { p.classList.remove('active'); });
        if (btnEl) btnEl.classList.add('active');

        if (typeof window.renderSavedCollection === 'function') {
          window.renderSavedCollection(document.getElementById('collection-grid'), null, currentFilter);
        }
      };

      // Initial hydration
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof window.renderSavedCollection === 'function') {
          window.renderSavedCollection(document.getElementById('collection-grid'), null, 'all');
        }
      });
    }());
  </script>
</body>

</html>
